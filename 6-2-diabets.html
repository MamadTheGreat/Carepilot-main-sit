<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بانک سوالات (مسیر دیابت) | Carepilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#6b4e71;
    --bg:#f7f6f3;
    --text:#2a2a2a;
    --muted:#6b6b6b;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Vazirmatn', Tahoma, sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 20px;
    background:#fff;
    border-bottom:2px solid var(--plum);
    flex-wrap:wrap;
    position:relative;
  }

  .topbar-title{
    font-size:1.05rem;
    font-weight:800;
    color:var(--plum);
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    text-decoration:none;
  }

  .topbar-actions{
    display:flex;
    gap:10px;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
    font-family:inherit;
    font-size:0.85rem;
    font-weight:600;
    padding:8px 16px;
    border-radius:6px;
    border:1px solid var(--plum);
    background:#fff;
    color:var(--plum);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }

  .btn:hover{
    background:var(--plum);
    color:#fff;
  }

  .btn-back{
    border-color:var(--muted);
    color:var(--muted);
  }

  .btn-back:hover{
    background:var(--muted);
    color:#fff;
  }

  .viewer-wrap{
    flex:1;
    padding:12px 20px 20px;
  }

  .password-screen{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .password-card{
    width:min(100%, 460px);
    padding:32px 28px;
    background:#fff;
    border:1px solid #e3dfe4;
    border-radius:14px;
    box-shadow:0 12px 32px rgba(62, 42, 66, .08);
    text-align:center;
  }

  .password-icon{
    width:56px;
    height:56px;
    display:grid;
    place-items:center;
    margin:0 auto 16px;
    border-radius:50%;
    background:#f0eaf1;
    color:var(--plum);
    font-size:1.5rem;
  }

  .password-card h1{
    margin-bottom:12px;
    color:var(--plum);
    font-size:1.3rem;
  }

  .password-card p{
    margin-bottom:22px;
    color:var(--muted);
    line-height:1.9;
    font-size:.92rem;
  }

  .password-form{
    display:flex;
    gap:10px;
  }

  .password-input{
    flex:1;
    min-width:0;
    padding:10px 12px;
    border:1px solid #cfc8d1;
    border-radius:6px;
    font:inherit;
    direction:ltr;
    text-align:left;
    outline:none;
  }

  .password-input:focus{
    border-color:var(--plum);
    box-shadow:0 0 0 3px rgba(107,78,113,.12);
  }

  .password-submit{
    background:var(--plum);
    color:#fff;
  }

  .password-submit:hover{
    background:#543b59;
  }

  .error-message{
    min-height:24px;
    margin-top:12px;
    color:#b42318;
    font-size:.82rem;
  }

  .hidden{
    display:none !important;
  }

  .viewer-frame{
    width:100%;
    height:100%;
    border:1px solid #ddd;
    border-radius:8px;
    background:#fff;
  }

  @media(max-width:600px){
    .topbar{
      flex-direction:column;
      align-items:flex-start;
      padding-top:54px;
    }
    .topbar-title{
      top:12px;
      left:50%;
    }
    .topbar-actions{width:100%; justify-content:flex-start;}
    .btn{font-size:0.78rem; padding:7px 12px;}
  }
</style>
</head>
<body>

  <section id="passwordScreen" class="password-screen">
    <div class="password-card">
      <div class="password-icon" aria-hidden="true">🔒</div>
      <h1>صفحهٔ محرمانهٔ مسیر دیابت</h1>
      <p>به دلیل محرمانه بودن اطلاعات این صفحه، برای مشاهدهٔ محتوا رمز عبور را وارد کنید.</p>
      <form id="passwordForm" class="password-form">
        <input
          id="passwordInput"
          class="password-input"
          type="password"
          placeholder="رمز عبور"
          autocomplete="off"
          required
          autofocus
        >
        <button type="submit" class="btn password-submit">ورود</button>
      </form>
      <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>
    </div>
  </section>

  <div id="protectedContent" class="hidden" style="height:100%;display:flex;flex-direction:column;">
    <div class="topbar">
    <a
      class="topbar-title"
      href="https://mamadthegreat.github.io/Carepilot-CRE-DP/"
      aria-label="ورود به سایت مسیر دیابت"
    >سایت مسیر دیابت</a>
    <div class="topbar-actions">
      <a href="index.html" class="btn btn-back">بازگشت</a>
      <a href="assets/diabets.pdf" download class="btn">دانلود</a>
      <button class="btn" onclick="printPDF()">پرینت</button>
    </div>
    </div>

    <div class="viewer-wrap">
      <iframe id="pdfFrame" class="viewer-frame" title="مستندات مسیر دیابت"></iframe>
    </div>
  </div>

<script>
  // رمز دلخواه خودتان را در این خط جایگزین کنید.
  const DIABETES_PASSWORD = 'Qwert54321';

  const passwordScreen = document.getElementById('passwordScreen');
  const protectedContent = document.getElementById('protectedContent');
  const passwordForm = document.getElementById('passwordForm');
  const passwordInput = document.getElementById('passwordInput');
  const errorMessage = document.getElementById('errorMessage');
  const pdfFrame = document.getElementById('pdfFrame');

  passwordForm.addEventListener('submit', function(event){
    event.preventDefault();

    if(passwordInput.value === DIABETES_PASSWORD){
      passwordScreen.classList.add('hidden');
      protectedContent.classList.remove('hidden');
      pdfFrame.src = 'assets/Diabetes Question Bank V1.0.pdf';
      errorMessage.textContent = '';
      passwordInput.value = '';
      return;
    }

    errorMessage.textContent = 'رمز عبور نادرست است.';
    passwordInput.select();
  });

  function printPDF(){
    if(pdfFrame.contentWindow){
      pdfFrame.contentWindow.focus();
      pdfFrame.contentWindow.print();
    }
  }
</script>

</body>
</html>
